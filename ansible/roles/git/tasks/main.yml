---
- name: Remove old GitHub CLI GPG key
  ansible.builtin.file:
    path: /usr/share/keyrings/githubcli-archive-keyring.gpg
    state: absent
  become: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Add GitHub CLI GPG key on Debian-based systems
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    mode: "0644"
    # 既定の get_url は If-Modified-Since で済ませ、手元の mtime が新しいと中身を比べない。
    # GitHub CLI は署名鍵を差し替えるので、毎回中身を比べる。同じなら書き換えない。
    force: true
  become: true
  register: git_gh_key
  when: ansible_facts['os_family'] == 'Debian'

- name: Add GitHub CLI apt repository on Debian-based systems
  ansible.builtin.copy:
    content: >-
      deb [arch={{ ansible_facts['architecture'] | regex_replace('x86_64', 'amd64') }}
      signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg]
      https://cli.github.com/packages stable main
    dest: /etc/apt/sources.list.d/github-cli.list
    mode: "0644"
  become: true
  register: git_gh_repo
  when: ansible_facts['os_family'] == 'Debian'

- name: Check whether apt has the GitHub CLI index
  ansible.builtin.stat:
    path: /var/lib/apt/lists/cli.github.com_packages_dists_stable_InRelease
  register: git_gh_index
  when: ansible_facts['os_family'] == 'Debian'

- name: Update apt cache for GitHub CLI
  ansible.builtin.apt:
    update_cache: true
  become: true
  # update が失敗した次の実行は鍵も list も changed にならないので、索引の有無も見る。
  # 索引が無いまま進むと、配布元の古い gh が入る。
  when: >-
    ansible_facts['os_family'] == 'Debian'
    and (git_gh_key is changed or git_gh_repo is changed or not git_gh_index.stat.exists)

- name: Add GitHub CLI dnf repository on RedHat-based systems
  ansible.builtin.yum_repository:
    name: gh-cli
    description: packages for the GitHub CLI
    baseurl: https://cli.github.com/packages/rpm
    # 公式の gh-cli.repo と同じ鍵束を使う。鍵 ID で名指しすると、鍵の差し替えに追従しない。
    gpgkey: https://cli.github.com/packages/githubcli-archive-keyring.asc
    gpgcheck: true
    repo_gpgcheck: true
  become: true
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install Git
  ansible.builtin.package:
    name: git
    state: present
  become: "{{ ansible_facts['os_family'] != 'Darwin' }}"

- name: Install GitHub CLI
  ansible.builtin.package:
    name: gh
    state: present
  become: "{{ ansible_facts['os_family'] != 'Darwin' }}"

- name: Install Git completion scripts
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/git/git/refs/heads/master/contrib/completion/{{ item }}"
    dest: "{{ ansible_facts['env'].HOME }}/.{{ item }}"
    mode: "0644"
  with_items:
    - git-completion.bash
    - git-completion.zsh

- name: Copy .gitconfig
  ansible.builtin.copy:
    src: .gitconfig
    dest: "{{ ansible_facts['env'].HOME }}/.gitconfig"
    mode: "0644"

- name: Create .gitconfig.local
  ansible.builtin.template:
    src: .gitconfig.local.j2
    dest: "{{ ansible_facts['env'].HOME }}/.gitconfig.local"
    mode: "0644"
    force: false

- name: Ensure git config directory exists
  ansible.builtin.file:
    path: "{{ git_config_dir }}/git"
    state: directory
    mode: "0755"

- name: Add entries to global gitignore
  ansible.builtin.blockinfile:
    # core.excludesFile を設定していなければ、git はこの場所を既定として読む。
    path: "{{ git_config_dir }}/git/ignore"
    # Claude Code も同じファイルに行を足すので、上書きせず印の間だけを持つ。
    block: "{{ lookup('ansible.builtin.file', 'ignore') }}"
    marker: "# {mark} dotfiles git role"
    create: true
    mode: "0644"
