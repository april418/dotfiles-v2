---
- name: Check if Claude CLI is already installed
  ansible.builtin.stat:
    path: "{{ ansible_facts['env'].HOME }}/.local/bin/claude"
  register: claude_cli_bin

- name: Download Claude CLI install script
  ansible.builtin.get_url:
    url: https://claude.ai/install.sh
    dest: /tmp/claude_install.sh
    mode: "0755"
  when: not claude_cli_bin.stat.exists and ansible_facts['os_family'] != 'Windows'

- name: Install Claude CLI
  ansible.builtin.command:
    cmd: bash /tmp/claude_install.sh
  when: not claude_cli_bin.stat.exists and ansible_facts['os_family'] != 'Windows'
  changed_when: true

- name: Debug Claude CLI already installed
  ansible.builtin.debug:
    msg: "{{ ansible_facts['env'].HOME }}/.local/bin/claude already exists, skipping Claude CLI installation."
  when: claude_cli_bin.stat.exists

- name: Ensure .claude directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env'].HOME }}/.claude"
    state: directory
    mode: "0700"

- name: Copy AGENTS.md as CLAUDE.md
  ansible.builtin.copy:
    src: files/AGENTS.md
    # Claude Code がユーザー全体の指示として読むのは ~/.claude/CLAUDE.md だけで、
    # AGENTS.md はプロジェクト単位でしか読まない。~/.claude/AGENTS.md に置くと
    # CLAUDE.md のあるリポジトリでは読まれない。
    dest: "{{ ansible_facts['env'].HOME }}/.claude/CLAUDE.md"
    mode: "0644"

- name: Set up the character
  ansible.builtin.include_tasks: character.yml

- name: Copy rules
  ansible.builtin.copy:
    # character.md は上のタスクが書くので、files/rules/ には同じ名前を置かない。
    src: files/rules/
    dest: "{{ ansible_facts['env'].HOME }}/.claude/rules/"
    mode: "0644"

- name: Check the pinned frontend-design URL
  ansible.builtin.assert:
    that:
      - claude_frontend_design_skill_url is match('^https://raw\.githubusercontent\.com/[\w.-]+/[\w.-]+/[0-9a-f]{40}/.+/skills/[^/]+/SKILL\.md$')
    fail_msg: >-
      claude_frontend_design_skill_url は
      https://raw.githubusercontent.com/<owner>/<repo>/<40 桁の SHA>/<プラグインのパス>/skills/<skill 名>/SKILL.md の形で書く
    quiet: true

- name: Ensure the dotfiles marketplace directory exists
  ansible.builtin.file:
    path: "{{ claude_marketplace_dir }}/.claude-plugin"
    state: directory
    mode: "0755"

- name: Write the dotfiles marketplace
  ansible.builtin.copy:
    content: "{{ claude_marketplace | to_nice_json(indent=2, sort_keys=False, ensure_ascii=False) }}\n"
    dest: "{{ claude_marketplace_dir }}/.claude-plugin/marketplace.json"
    mode: "0644"

- name: Check if settings.json exists
  ansible.builtin.stat:
    path: "{{ ansible_facts['env'].HOME }}/.claude/settings.json"
  register: claude_settings_stat

- name: Read existing settings.json
  ansible.builtin.slurp:
    src: "{{ ansible_facts['env'].HOME }}/.claude/settings.json"
  register: claude_settings_current
  when: claude_settings_stat.stat.exists

- name: Merge settings.json
  ansible.builtin.copy:
    # Claude Code は /config や /fast での選択もこのファイルに書き込むため、
    # 上書きせず既存の内容にリポジトリ側を重ねる。
    # 出力は Claude Code が書く形式（キー順を保持、非 ASCII はそのまま）に揃え、
    # 中身が変わらなければ changed にならないようにする。
    content: "{{ claude_settings_merged | to_nice_json(indent=2, sort_keys=False, ensure_ascii=False) }}\n"
    dest: "{{ ansible_facts['env'].HOME }}/.claude/settings.json"
    mode: "0644"
  # リポジトリ側の値で置き換わって消えるもの（/permissions で足した規則など）を、
  # --diff を付けずに流しても表示する。
  diff: true
  vars:
    # 配列は和集合にせず置き換える。和集合だとリポジトリから消した allow 規則が
    # 残り続け、書き換えたフックは旧エントリと二重に動く。
    claude_settings_merged: >-
      {{ (claude_settings_current.content | default('') | b64decode | trim or '{}')
         | from_json
         | combine(lookup('ansible.builtin.file', 'settings.json') | from_json, claude_plugin_settings,
                   recursive=True, list_merge='replace') }}

- name: Ensure ccstatusline config directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env'].HOME }}/.config/ccstatusline"
    state: directory
    mode: "0755"

- name: Copy ccstatusline settings
  ansible.builtin.copy:
    src: files/ccstatusline.json
    dest: "{{ ansible_facts['env'].HOME }}/.config/ccstatusline/settings.json"
    mode: "0644"

- name: Copy hooks
  ansible.builtin.copy:
    src: files/hooks/
    dest: "{{ ansible_facts['env'].HOME }}/.claude/hooks/"
    # フックは Claude Code から直接実行されるため実行権限が要る。
    # 0644 だと起動できず、しかもフックが動かないことに気づけない。
    mode: "0755"

- name: Ensure local bin directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env'].HOME }}/.local/bin"
    state: directory
    mode: "0755"

- name: Copy evacuate
  ansible.builtin.copy:
    src: files/bin/evacuate
    # 権限設定の Bash(evacuate:*) はコマンド名で当たるので、PATH にある ~/.local/bin に置く。
    dest: "{{ ansible_facts['env'].HOME }}/.local/bin/evacuate"
    mode: "0755"

- name: Copy skills
  ansible.builtin.copy:
    src: files/skills/
    dest: "{{ ansible_facts['env'].HOME }}/.claude/skills/"
    mode: "0644"

- name: Copy agents
  ansible.builtin.copy:
    src: files/agents/
    dest: "{{ ansible_facts['env'].HOME }}/.claude/agents/"
    mode: "0644"

- name: Ensure external skill directories exist
  ansible.builtin.file:
    path: "{{ ansible_facts['env'].HOME }}/.claude/skills/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - empirical-prompt-tuning

- name: Download external skills
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ ansible_facts['env'].HOME }}/.claude/skills/{{ item.dest }}"
    mode: "0644"
  loop:
    # main の追従ではなくコミット SHA で固定する。上流はリポジトリの構成変更や
    # ファイルの再配置が多く、追従するとビルドが壊れる。更新と移動は dotfiles check が知らせる。
    - url: https://raw.githubusercontent.com/mizchi/skills/a41865b34b78f2675a6c73178377a5bcc1b492c6/empirical-prompt-tuning/SKILL.md
      dest: empirical-prompt-tuning/SKILL.md
  loop_control:
    label: "{{ item.dest }}"
