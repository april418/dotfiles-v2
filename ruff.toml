# files/dotfiles と evacuate は拡張子が無いので名指しする。既定の対象にある Markdown は prettier に任せる。
include = [
  "*.py",
  "ansible/roles/dotfiles/files/dotfiles",
  "ansible/roles/claude/files/bin/evacuate",
]
line-length = 120
# フックと dotfiles コマンドは PATH の python3 で動き、macOS では 3.9 が当たる。3.10 以降でしか動かない書き方を勧めさせない。
target-version = "py39"
